language: ja-JP
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  path_filters:
    - "!release/**"
    - "!**/*.apk"
    - "!gradle/wrapper/**"
  path_instructions:
    - path: "app/src/main/java/**"
      instructions: >-
        Kotlin/Android code. Check for null-safety, lifecycle leaks, and that
        pure logic stays free of Android framework dependencies so it remains
        unit-testable.
    - path: "app/src/test/**"
      instructions: >-
        Unit tests must exercise real code paths, not mocks.
